[database]

; Database driver: sqlite | mysql | pgsql
driver = sqlite

; SQLite configuration
path = template.sqlite

; MySQL / PostgreSQL configuration
host = localhost
port = 3306
name = template
username = root
password =

; Common configuration
schema = template.sql
foreign_keys = true
timeout = 30


[csv]
directory = data
enabled = true
encoding = utf-8-sig
delimiter = ,