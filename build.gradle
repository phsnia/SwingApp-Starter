plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.10-SNAPSHOT'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.hibernate.tool.hibernate-tools-gradle' version '8.0.0.Alpha1'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	maven { url = 'https://repo.spring.io/snapshot' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Generates the OpenAPI document at /v3/api-docs.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.2.0'

	// Must be on the compile classpath for the Hibernate Tools generateJava task.
	implementation 'com.mysql:mysql-connector-j'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

hibernateTools {
	packageName = 'com.example.HMS.Manga.entity'
	outputFolder = 'src/main/java'
	hibernateProperties = 'hibernate-generator.properties'
	revengFile = 'manga.reveng.xml'
	generateAnnotations = true
	useGenerics = true
}

// Generator-only inputs: keep them out of the application artifact.
tasks.named('processResources') {
	exclude 'hibernate-generator.properties'
	exclude 'manga.reveng.xml'
}

// `./gradlew run` would otherwise be abbreviated to Hibernate Tools' `runSql`
// task (which is H2-oriented and hardcodes user "sa"). Make it launch the app.
tasks.register('run') {
	group = 'application'
	description = 'Runs the Spring Boot application (alias for bootRun).'
	dependsOn tasks.named('bootRun')
}

// Desktop app: Spring context + Swing screens in the same JVM.
tasks.register('runUi', JavaExec) {
	group = 'application'
	description = 'Runs the Spring + Swing desktop app.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.example.HMS.GUI.SwingLauncher'
}

// Component showcase without a database connection.
tasks.register('runUiDemo', JavaExec) {
	group = 'application'
	description = 'Runs the Swing component demo (no database).'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.example.HMS.GUI.SwingDemo'
}

tasks.named('test') {
	useJUnitPlatform()
}
